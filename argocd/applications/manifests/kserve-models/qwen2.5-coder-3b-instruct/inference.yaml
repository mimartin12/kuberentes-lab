apiVersion: "serving.kserve.io/v1beta1"
kind: "InferenceService"
metadata:
  name: "qwen-coder"
  namespace: kserve-test
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    serving.kserve.io/autoscalerClass: "keda"
spec:
  predictor:
    minReplicas: 0
    maxReplicas: 1
    autoScaling:
      metrics:
        - type: External
          external:
            metric:
              backend: prometheus
              serverAddress: "http://192.168.1.200:9090"
              query: "sum(vllm:num_requests_running{model_name='qwen-coder'})"
            target:
              type: Value
              value: "5"
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    runtimeClassName: nvidia
    volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
    model:
      modelFormat:
        name: huggingface
      args:
        - --model_name=qwen-coder
        - --max-model-len=32768
      volumeMounts:
        - name: dshm
          mountPath: /dev/shm
      storageUri: "pvc://qwen-coder-pvc/qwen-coder/Qwen2.5-Coder-3B-Instruct"
      resources:
        limits:
          cpu: "2"
          memory: 12Gi
          nvidia.com/gpu: "1"
        requests:
          cpu: "1"
          memory: 10Gi
          nvidia.com/gpu: "1"